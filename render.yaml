services:
  - type: web
    name: piecefit
    runtime: ruby
    buildCommand: "./bin/render-build.sh"
    startCommand: "bundle exec puma -C config/puma.rb"
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: RAILS_MASTER_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: APP_HOST
        value: piecefit.app
      - key: SOLID_QUEUE_IN_PUMA
        value: "true"
